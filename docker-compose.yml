version: '3.9'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mbo-portfolio
    ports:
      - "8080:80"
    environment:
      - TZ=UTC
    volumes:
      # For local development - hot reload
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - mbo-network

networks:
  mbo-network:
    driver: bridge
